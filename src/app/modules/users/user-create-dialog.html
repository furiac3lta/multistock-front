<h2 mat-dialog-title>Crear usuario</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <p class="dialog-copy">Definí acceso, rol y sucursal para el nuevo usuario.</p>

    <div class="form-grid">
      <div class="input-group">
        <label>Usuario</label>
        <input type="text" formControlName="username">
      </div>

      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" formControlName="fullName">
      </div>

      <div class="input-group">
        <label>Teléfono</label>
        <input type="text" formControlName="phone">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password">
        <small *ngIf="form.get('password')?.hasError('minlength')">Mínimo 6 caracteres</small>
      </div>

      <div class="input-group">
        <label>Rol</label>
        <select formControlName="role">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>

      <div class="input-group">
        <label>Sucursal</label>
        <select formControlName="branchId">
          <option *ngFor="let b of branches" [value]="b.id">{{ b.name }}</option>
        </select>
      </div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" formControlName="active">
      Usuario activo
    </label>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancelar</button>
  <button mat-raised-button (click)="save()">Crear</button>
</div>
