<div class="page-shell">
  <section class="page-header">
    <div class="page-title-wrap">
      <span class="page-kicker">Operaciones</span>
      <h1 class="page-title">Registrar salida de stock</h1>
      <p class="page-subtitle">Documentá egresos con claridad para mantener consistencia operativa.</p>
    </div>
  </section>

  <section class="page-card">
    <div class="stack-form">
      <mat-form-field appearance="outline">
        <mat-label>Producto</mat-label>
        <mat-select [(ngModel)]="productId">
          <mat-option *ngFor="let p of products" [value]="p.id">
            {{ p.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cantidad</mat-label>
        <input type="number" matInput [(ngModel)]="quantity" min="1">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Descripción</mat-label>
        <textarea matInput [(ngModel)]="description"></textarea>
      </mat-form-field>

      <div class="action-row">
        <button mat-raised-button color="warn" (click)="save()">Registrar salida</button>
      </div>
    </div>
  </section>
</div>
