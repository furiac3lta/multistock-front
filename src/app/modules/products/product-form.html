<h2 mat-dialog-title>{{ data ? 'Editar Producto' : 'Nuevo Producto' }}</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <p class="dialog-copy">Completá la información comercial y operativa del producto.</p>

    <div class="form-grid">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>SKU</mat-label>
        <input matInput formControlName="sku">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" min="0">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Precio costo</mat-label>
        <input matInput type="number" formControlName="costPrice" min="0">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Precio venta</mat-label>
        <input matInput type="number" formControlName="salePrice" min="0">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option *ngFor="let c of categories" [value]="c.id">
            {{ c.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()">Guardar</button>
</div>
