<h2 mat-dialog-title>Transferir Stock</h2>

<div mat-dialog-content>
  <p class="dialog-meta"><strong>Producto:</strong> {{ data.name }}</p>
  <p class="dialog-meta"><strong>Stock disponible:</strong> {{ data.stock }}</p>

  <form [formGroup]="form" class="form-wrapper">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Sucursal destino</mat-label>
      <mat-select formControlName="targetBranchId">
        <mat-option *ngFor="let b of branches" [value]="b.id">
          {{ b.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Cantidad a transferir</mat-label>
      <input matInput type="number" min="1" formControlName="quantity">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()">Transferir</button>
</div>
